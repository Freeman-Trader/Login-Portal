<form method="POST">
    <h2>Register</h2>
    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Register</button>
    <a href="/login">Login</a>
</form>
<footer style="margin-top: 50px; padding: 20px; border-top: 1px solid #ccc; font-family: monospace; font-size: 0.8em; color: #666;">
    <p>Server Host: {{ host_name }} | Server IP: {{ host_ip }}</p>
</footer>
